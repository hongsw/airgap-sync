# airgap-sync 설정 예시 — 복사해서 저장소 밖(예: ~/.airgap-sync/airgap-sync.conf)에 두고 값을 채운다.
# 이 파일에는 토큰을 쓰지 않는다. 토큰은 *_TOKEN_FILE 이 가리키는 파일(중간 PC 에만, 권한 600)이나
# 환경 변수 AIRGAP_SOURCE_TOKEN / AIRGAP_TARGET_TOKEN 으로만 준다.
# 모든 키는 환경 변수 AIRGAP_<키> 로 덮을 수 있다 (예: AIRGAP_BRANCHES="release/* main hotfix/*").

# 기록·작업 폴더 이름에 쓰는 이름
NAME=example-app

# 개발망 GitLab 저장소 (읽기). HTTPS 또는 SSH 주소. CI 잡(ci 명령)에서는 비워 두면 그 잡의 저장소를 job token 으로 읽는다.
SOURCE_URL=https://gitlab.dev.example.com/group/app.git
# 개발망 토큰 파일(read_repository). 비우면 git credential 관리자·SSH 키를 쓴다.
SOURCE_TOKEN_FILE=

# 운영망 GitLab 저장소 (쓰기)
TARGET_URL=http://gitlab.prod.example.internal/group/app.git
# 운영망 토큰 파일 — write_repository(브랜치 push) + api(패키지 조회·업로드). 중간 PC 에만 둔다.
TARGET_TOKEN_FILE=~/.airgap-sync/target.token

# 운영망 호스트 이름이 DNS 로 안 풀릴 때 git·curl 에만 주소를 고정한다 (시스템 hosts·네트워크 설정은 건드리지 않는다)
#   형식: <호스트>:<포트>:<IP>
TARGET_RESOLVE=
SOURCE_RESOLVE=

# 넘길 브랜치 패턴 (공백 구분 glob, * 는 / 도 포함)
BRANCHES=release/* main

# push 옵션 (공백 구분, git push -o). 운영망 파이프라인을 돌리지 않으려면 ci.skip
PUSH_OPTIONS=
# 여러 브랜치를 한꺼번에(전부 되거나 전부 안 되게) 넣는다. 서버가 지원하지 않으면 0
PUSH_ATOMIC=1

# 작업 저장소·기록 위치 (기본: ~/.airgap-sync/work/<NAME>, 기록은 그 안 sync-log.tsv)
WORK_DIR=
LOG_FILE=

# ---- 바이너리 반입 (packages 단계, 선택) ----
# lock 파일 경로(저장소 안, 공백 구분). 패키지 이름 = lock 파일 이름에서 .lock 을 뗀 것.
#   형식 A: <이름:버전> <파일> <sha256>   (한 줄에 하나)
#   형식 B: version=… / file=… / sha256=…
PACKAGE_LOCKS=deploy/releases/images.lock
# lock 을 읽을 브랜치
PACKAGE_REF=main
# 실제 파일을 찾을 로컬 폴더 (; 로 구분 — Windows 경로의 : 와 섞이지 않게)
PACKAGE_DIRS=~/airgap/images;D:/transfer
# 패키지 API 주소·프로젝트 (비우면 TARGET_URL 에서 만든다: <scheme>://<host>/api/v4 · group/app)
TARGET_API_URL=
TARGET_PROJECT=
